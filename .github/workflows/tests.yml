---
name: Tests

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Run pre-commit hooks
        run: uvx --with pre-commit-uv pre-commit run --all-files

  py-compile:
    name: Python compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Compile Python files
        run: |
          python3 -m py_compile custom_components/rte_france/*.py
