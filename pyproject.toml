[project]
name = "ha_rte_france"
version = "0.1.0"
description = "Home Assistant RTE France custom integration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["aiohttp>=3.9", "pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60
